name: url-shortener

services:
  # 数据库使用宿主机已装的 MySQL（127.0.0.1:3306 / study 库），不再内置 mysql 容器；
  # 应用启动时会自动执行 schema.sql 建表（CREATE TABLE IF NOT EXISTS，不影响已有表）。
  # 如需改回容器化 MySQL，可重新加入 mysql:8.4 服务并把 app 的 MYSQL_HOST 指回服务名。

  redis:
    image: redis:7-alpine
    container_name: us-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 两个无状态应用实例，由 Nginx 轮询负载均衡，任意一个宕机不影响服务
  app1: &app
    build: .
    container_name: us-app1
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3306"
      MYSQL_DB: study
      MYSQL_USER: root
      MYSQL_PASSWORD: zhaoZ1230
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_BASE_URL: http://localhost
      APP_API_KEY: change-me-admin-key
      TZ: Asia/Shanghai
    # host-gateway：让容器访问宿主机 MySQL（Linux 下也生效，Mac 下等价于内置 host.docker.internal）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  app2:
    <<: *app
    container_name: us-app2

  nginx:
    image: nginx:1.27-alpine
    container_name: us-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped

volumes:
  redis-data:
